[project]
name = "llm-toolbox"
version = "0.1.1"
description = "Extra Assist LLM API tools for every Home Assistant conversation agent"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "homeassistant", "pytest_homeassistant_custom_component"]
