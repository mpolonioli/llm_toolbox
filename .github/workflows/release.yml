name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check manifest version matches tag
        run: |
          manifest_version=$(jq -r .version custom_components/llm_toolbox/manifest.json)
          if [ "v$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi

      - name: Build zip
        working-directory: custom_components
        run: zip -r ../llm_toolbox.zip llm_toolbox -x "*/__pycache__/*"

      - name: Write release notes from commits since the last tag
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range=${previous:+$previous..}$GITHUB_REF_NAME
          {
            echo "## Changes"
            git log --no-merges --format="- %s (%h)" "$range"
            if [ -n "$previous" ]; then
              echo
              echo "**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
            fi
          } > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" llm_toolbox.zip --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
